<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人心率即時團控看板 (支援自動重連)</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    h1 { margin: 0; font-size: 1.5rem; }
    
    .summary-bar {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .badge-item {
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }
    .badge-item.matched { background: #00e676; color: #000000; }
    .badge-item.unmatched { background: #ff9800; color: #000000; }
    .badge-item.reconnecting { background: #ffeb3b; color: #000000; } /* 重連中狀態 */
    
    .btn {
      background: #00e676; color: #000; border: none; padding: 12px 20px;
      font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .btn-save { background: #29b6f6; margin-left: 10px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    
    .card {
      background: #1e1e1e; border-radius: 12px; padding: 16px; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: background 0.3s, border 0.3s;
    }
    
    .card .item-number-container { margin-bottom: 8px; }
    .card .item-number-badge {
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      padding: 6px 12px;
      display: inline-block;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }
    .card .item-number-badge:hover { opacity: 0.85; transform: translateY(-1px); }
    .card .item-number-badge.matched { color: #00e676; background: rgba(0, 230, 118, 0.15); border: 1px solid #00e676; }
    .card .item-number-badge.unmatched { color: #ffb74d; background: rgba(255, 183, 77, 0.15); border: 1px dashed #ffb74d; }
    
    .card .device-name { font-size: 0.85rem; color: #888; margin-bottom: 8px; }
    .card .bpm { font-size: 3.5rem; font-weight: 900; line-height: 1; margin: 10px 0; }
    .card .zone-label { font-size: 0.85rem; font-weight: bold; text-transform: uppercase; }
    .card .stats { font-size: 0.75rem; color: #888; margin-top: 8px; }
    
    .zone-warmup { background: #1b5e20; color: #a5d6a7; } 
    .zone-aerobic { background: #f57f17; color: #fffde7; } 
    .zone-threshold { background: #e65100; color: #ffe0b2; } 
    .zone-max { background: #b71c1c; color: #ffcdd2; } 
    /* 斷線重連中卡片樣式 */
    .zone-reconnecting { background: #37474f; color: #fff59d; border: 1px dashed #fbc02d; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🚴‍♂️ 多人心率團控看板</h1>
      <div class="summary-bar">
        <span>已連線裝備：</span>
        <div id="itemListSummary"><span style="color:#666;">尚無連線裝置</span></div>
      </div>
    </div>
    <div>
      <button class="btn" id="btnConnect">+ 連接心率裝置</button>
      <button class="btn btn-save" onclick="saveToSheets()">💾 上傳紀錄至試算表</button>
    </div>
  </header>

  <div class="grid" id="cardContainer"></div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzdQV7quuIG04_KVvaog6dI8qRjRIRncgeMiWfJoNF1OCbIo3brkk_iillVyF1bikhDbw/exec";
    const connectedDevices = [];

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    document.getElementById('btnConnect').addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        alert("⚠️ 瀏覽器不支援 Web Bluetooth API，請使用 HTTPS 或 localhost 環境開啟！");
        return;
      }

      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: ['heart_rate'] }]
        });

        const deviceId = device.id;
        const deviceName = device.name || `心率帶 ${connectedDevices.length + 1}`;

        const deviceData = {
          device: device,            // 保存原始藍芽裝置物件，做為重連用
          id: deviceId,
          name: deviceName,
          itemNumber: "",
          bpmHistory: [],
          maxHr: 0,
          element: null,
          isReconnecting: false,    // 是否正在嘗試重連
          reconnectTimer: null
        };

        const cardElement = createCardElement(deviceData);
        deviceData.element = cardElement;
        connectedDevices.push(deviceData);

        // 綁定斷線與數據監聽
        await connectToDevice(deviceData);

        // 監聽斷線事件：自動啟動背景重連
        device.addEventListener('gattserverdisconnected', () => {
          handleDisconnect(deviceData);
        });

        updateBoardHeaderSummary();
        matchItemNumberFromGAS(deviceData);

      } catch (error) {
        console.log("連線取消或失敗:", error);
      }
    });

    // 連線與訂閱藍芽數據邏輯
    async function connectToDevice(deviceData) {
      const server = await deviceData.device.gatt.connect();
      const service = await server.getPrimaryService('heart_rate');
      const characteristic = await service.getCharacteristic('heart_rate_measurement');

      await characteristic.startNotifications();
      characteristic.addEventListener('characteristicvaluechanged', (event) => {
        const value = event.target.value;
        const bpm = value.getUint8(1); 
        updateDeviceData(deviceData, bpm);
      });
    }

    // 💡 斷線處理：自動觸發重連機制
    function handleDisconnect(deviceData) {
      console.warn(`[藍芽斷線] 裝置 ${deviceData.name} 斷開連線，開啟自動重連機制...`);
      
      const card = deviceData.element;
      card.className = 'card zone-reconnecting';
      card.querySelector('.bpm').innerText = '...';
      card.querySelector('.zone-label').innerText = '⚡ 自動重連中';

      updateBoardHeaderSummary();

      // 開啟背景每 3 秒自動重連一次的迴圈
      if (!deviceData.isReconnecting) {
        deviceData.isReconnecting = true;
        
        deviceData.reconnectTimer = setInterval(async () => {
          try {
            console.log(`[自動重連] 嘗試重新連接 ${deviceData.name}...`);
            await connectToDevice(deviceData);

            // 成功連上，清除重連迴圈
            clearInterval(deviceData.reconnectTimer);
            deviceData.isReconnecting = false;
            deviceData.reconnectTimer = null;
            
            console.log(`[自動重連] ✅ 裝置 ${deviceData.name} 成功恢復連線！`);
            updateBoardHeaderSummary();
          } catch (err) {
            console.log(`[自動重連] 尚未搜到裝置，3秒後再次嘗試...`);
          }
        }, 3000); // 每 3 秒嘗試一次
      }
    }

    // 依名稱對照 Sheet2
    async function matchItemNumberFromGAS(deviceData) {
      const badgeEl = deviceData.element.querySelector('.item-number-badge');

      try {
        const safeName = encodeURIComponent(deviceData.name);
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getItemNumber&deviceName=${safeName}`);
        const data = await response.json();

        if (data && data.matched && data.itemNumber) {
          deviceData.itemNumber = data.itemNumber;
          badgeEl.innerText = `📦 ${data.itemNumber}`;
          badgeEl.className = "item-number-badge matched";
        } else {
          deviceData.itemNumber = "";
          badgeEl.innerText = `✏️ 點此選擇物品編號`;
          badgeEl.className = "item-number-badge unmatched";
        }
      } catch (error) {
        deviceData.itemNumber = "";
        badgeEl.innerText = `✏️ 點此選擇物品編號`;
        badgeEl.className = "item-number-badge unmatched";
      }

      updateBoardHeaderSummary();
    }

    // 手動指定物品編號
    function promptSetItemNumber(deviceId) {
      const deviceData = connectedDevices.find(d => d.id === deviceId);
      if (!deviceData) return;

      const input = prompt(`請輸入裝備編號 (例如: 01號, A05):`, deviceData.itemNumber || "");
      if (input !== null) {
        const trimmed = input.trim();
        deviceData.itemNumber = trimmed;
        
        const badgeEl = deviceData.element.querySelector('.item-number-badge');
        if (trimmed) {
          badgeEl.innerText = `📦 ${trimmed}`;
          badgeEl.className = "item-number-badge matched";
        } else {
          badgeEl.innerText = `✏️ 點此選擇物品編號`;
          badgeEl.className = "item-number-badge unmatched";
        }
        updateBoardHeaderSummary();
      }
    }

    function updateBoardHeaderSummary() {
      const summaryContainer = document.getElementById('itemListSummary');
      
      const badgeList = connectedDevices.map(d => {
        if (d.isReconnecting) {
          return `<span class="badge-item reconnecting">⚡ 重連中 (${escapeHtml(d.itemNumber || d.name)})</span>`;
        } else if (d.itemNumber) {
          return `<span class="badge-item matched">📦 ${escapeHtml(d.itemNumber)}</span>`;
        } else {
          return `<span class="badge-item unmatched">⚠️ 待指定 (${escapeHtml(d.name)})</span>`;
        }
      });

      if (badgeList.length > 0) {
        summaryContainer.innerHTML = badgeList.join(' ');
      } else {
        summaryContainer.innerHTML = '<span style="color:#666;">尚無連線裝置</span>';
      }
    }

    function createCardElement(deviceData) {
      const container = document.getElementById('cardContainer');
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${deviceData.id}`;
      card.innerHTML = `
        <div class="item-number-container">
          <span class="item-number-badge unmatched" onclick="promptSetItemNumber('${deviceData.id}')">
            🔍 比對中...
          </span>
        </div>
        <div class="device-name">藍芽名稱: ${escapeHtml(deviceData.name)}</div>
        <div class="bpm">--</div>
        <div class="zone-label">等待數據...</div>
        <div class="stats">最高: -- | 平均: --</div>
      `;
      container.appendChild(card);
      return card;
    }

    function updateDeviceData(deviceData, bpm) {
      deviceData.bpmHistory.push(bpm);
      if (bpm > deviceData.maxHr) deviceData.maxHr = bpm;
      
      const sum = deviceData.bpmHistory.reduce((a, b) => a + b, 0);
      const avgHr = Math.round(sum / deviceData.bpmHistory.length);

      const card = deviceData.element;
      card.querySelector('.bpm').innerText = bpm;
      card.querySelector('.stats').innerText = `最高: ${deviceData.maxHr} | 平均: ${avgHr}`;

      card.className = 'card ' + getZoneClass(bpm);
      card.querySelector('.zone-label').innerText = getZoneText(bpm);
    }

    function getZoneClass(bpm) {
      if (bpm < 120) return 'zone-warmup';
      if (bpm < 150) return 'zone-aerobic';
      if (bpm < 170) return 'zone-threshold';
      return 'zone-max';
    }

    function getZoneText(bpm) {
      if (bpm < 120) return '暖身 / 輕度';
      if (bpm < 150) return '燃脂 / 有氧';
      if (bpm < 170) return '馬拉松 / 閾值';
      return '無氧 / 警示';
    }

    async function saveToSheets() {
      if (connectedDevices.length === 0) {
        alert("目前沒有連接任何裝置！");
        return;
      }

      const payload = connectedDevices.map(d => {
        const sum = d.bpmHistory.reduce((a, b) => a + b, 0);
        return {
          id: d.id,
          itemNumber: d.itemNumber || "未指定裝備",
          name: d.name,
          avgHr: d.bpmHistory.length ? Math.round(sum / d.bpmHistory.length) : 0,
          maxHr: d.maxHr,
          count: d.bpmHistory.length
        };
      });

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert("🎉 數據已傳送至 Google 試算表！");
      } catch (err) {
        alert("❌ 上傳失敗: " + err);
      }
    }
  </script>
</body>
</html>
