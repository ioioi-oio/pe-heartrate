<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人心率即時團控看板</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    h1 { margin: 0; font-size: 1.5rem; }
    
    /* 頂部看板同步物品清單樣式 */
    .summary-bar {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    /* 標籤通用樣式 */
    .badge-item {
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }
    /* 比對成功的標籤 (綠色) */
    .badge-item.matched {
      background: #00e676;
      color: #000000;
    }
    /* 比對失敗 / 預設顯示內碼的標籤 (藍灰色) */
    .badge-item.unmatched {
      background: #37474f;
      color: #eceff1;
      border: 1px solid #546e7a;
    }
    
    .btn {
      background: #00e676; color: #000; border: none; padding: 12px 20px;
      font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .btn-save { background: #29b6f6; margin-left: 10px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    
    .card {
      background: #1e1e1e; border-radius: 12px; padding: 16px; text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: background 0.3s;
    }
    
    /* 物品編號 / 裝置內碼標籤 (卡片內) */
    .card .item-number {
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      padding: 4px 8px;
      margin-bottom: 8px;
      display: block;
      word-break: break-all;
      transition: all 0.3s ease;
    }
    /* 卡片內 - 比對成功 */
    .card .item-number.matched {
      color: #00e676;
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid #00e676;
    }
    /* 卡片內 - 比對失敗/顯示內碼 */
    .card .item-number.unmatched {
      color: #b0bec5;
      background: rgba(176, 190, 197, 0.1);
      border: 1px solid #546e7a;
    }
    
    .card .device-name { font-size: 0.85rem; color: #888; margin-bottom: 8px; }
    .card .bpm { font-size: 3.5rem; font-weight: 900; line-height: 1; margin: 10px 0; }
    .card .zone-label { font-size: 0.85rem; font-weight: bold; text-transform: uppercase; }
    .card .stats { font-size: 0.75rem; color: #888; margin-top: 8px; }
    
    .zone-warmup { background: #1b5e20; color: #a5d6a7; } 
    .zone-aerobic { background: #f57f17; color: #fffde7; } 
    .zone-threshold { background: #e65100; color: #ffe0b2; } 
    .zone-max { background: #b71c1c; color: #ffcdd2; } 
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🚴‍♂️ 多人心率團控看板</h1>
      <!-- 看板頂部同步顯示已配對物品/內碼清單 -->
      <div class="summary-bar">
        <span>已連線裝置：</span>
        <div id="itemListSummary"><span style="color:#666;">尚無連線裝置</span></div>
      </div>
    </div>
    <div>
      <button class="btn" id="btnConnect">+ 連接心率裝置</button>
      <button class="btn btn-save" onclick="saveToSheets()">💾 上傳紀錄至試算表</button>
    </div>
  </header>

  <div class="grid" id="cardContainer"></div>

  <script>
    // 發佈的 Google Apps Script Web App 網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzdQV7quuIG04_KVvaog6dI8qRjRIRncgeMiWfJoNF1OCbIo3brkk_iillVyF1bikhDbw/exec";

    const connectedDevices = [];

    document.getElementById('btnConnect').addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        alert("⚠️ 瀏覽器不支援 Web Bluetooth API，請使用 HTTPS 或 localhost 環境開啟！");
        return;
      }

      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: ['heart_rate'] }]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('heart_rate');
        const characteristic = await service.getCharacteristic('heart_rate_measurement');

        const deviceId = device.id; // 藍芽裝置內碼 (Unique ID)
        const deviceName = device.name || `心率帶 ${connectedDevices.length + 1}`;

        // 1. 先建立卡片 (預設帶入裝置內碼)
        const cardElement = createCardElement(deviceId, deviceName);

        const deviceData = {
          id: deviceId,
          name: deviceName,
          itemNumber: "", // 用於儲存 Sheet2 比對成功的物品編號
          bpmHistory: [],
          maxHr: 0,
          element: cardElement
        };

        connectedDevices.push(deviceData);

        // ⚡ 2. 立即更新頂部「已連線裝置」標籤列（不用等待 GAS 請求，達 0 秒延遲效果）
        updateBoardHeaderSummary();

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', (event) => {
          const value = event.target.value;
          const bpm = value.getUint8(1); 
          updateDeviceData(deviceData, bpm);
        });

        device.addEventListener('gattserverdisconnected', () => {
          deviceData.element.querySelector('.bpm').innerText = 'OFF';
          deviceData.element.className = 'card';
          updateBoardHeaderSummary(); // 斷線時同步更新看板頂部
        });

        // ⚡ 3. 背景執行 Sheet2 比對，比對完自動無縫更新 UI
        matchItemNumberFromGAS(deviceData);

      } catch (error) {
        console.log("連線取消或失敗:", error);
      }
    });

    // 向 GAS 查詢藍芽內碼對應 Sheet2 的物品編號
    async function matchItemNumberFromGAS(deviceData) {
      const itemEl = deviceData.element.querySelector('.item-number');

      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getItemNumber&deviceId=${encodeURIComponent(deviceData.id)}`);
        const data = await response.json();

        if (data && data.matched && data.itemNumber) {
          // ✅ 比對成功：換成 Sheet2 的物品編號
          deviceData.itemNumber = data.itemNumber;
          itemEl.innerText = `📦 ${data.itemNumber}`;
          itemEl.className = "item-number matched";
        } else {
          // ❌ 比對失敗：維持顯示裝置內碼
          deviceData.itemNumber = "";
          itemEl.innerText = `🆔 ${deviceData.id}`;
          itemEl.className = "item-number unmatched";
        }
      } catch (error) {
        console.error("無法查詢物品編號:", error);
        // 發生錯誤時同樣呈現裝置內碼
        deviceData.itemNumber = "";
        itemEl.innerText = `🆔 ${deviceData.id}`;
        itemEl.className = "item-number unmatched";
      }

      // 同步更新頂部看板清單
      updateBoardHeaderSummary();
    }

    // 更新頂部看板的已連線清單 (成功顯示物品編號，失敗顯示裝置內碼)
    function updateBoardHeaderSummary() {
      const summaryContainer = document.getElementById('itemListSummary');
      
      const badgeList = connectedDevices.map(d => {
        if (d.itemNumber) {
          // 比對成功
          return `<span class="badge-item matched">📦 ${d.itemNumber}</span>`;
        } else {
          // 比對失敗或尚未比對完成時先顯示裝置內碼
          return `<span class="badge-item unmatched">🆔 ${d.id}</span>`;
        }
      });

      if (badgeList.length > 0) {
        summaryContainer.innerHTML = badgeList.join(' ');
      } else {
        summaryContainer.innerHTML = '<span style="color:#666;">尚無連線裝置</span>';
      }
    }

    function createCardElement(id, name) {
      const container = document.getElementById('cardContainer');
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${id}`;
      card.innerHTML = `
        <!-- 預設直接顯示裝置內碼 -->
        <div class="item-number unmatched">🆔 ${id}</div>
        <!-- 藍芽裝置原始名稱 -->
        <div class="device-name">${name}</div>
        <div class="bpm">--</div>
        <div class="zone-label">等待數據...</div>
        <div class="stats">最高: -- | 平均: --</div>
      `;
      container.appendChild(card);
      return card;
    }

    function updateDeviceData(deviceData, bpm) {
      deviceData.bpmHistory.push(bpm);
      if (bpm > deviceData.maxHr) deviceData.maxHr = bpm;
      
      const sum = deviceData.bpmHistory.reduce((a, b) => a + b, 0);
      const avgHr = Math.round(sum / deviceData.bpmHistory.length);

      const card = deviceData.element;
      card.querySelector('.bpm').innerText = bpm;
      card.querySelector('.stats').innerText = `最高: ${deviceData.maxHr} | 平均: ${avgHr}`;

      card.className = 'card ' + getZoneClass(bpm);
      card.querySelector('.zone-label').innerText = getZoneText(bpm);
    }

    function getZoneClass(bpm) {
      if (bpm < 120) return 'zone-warmup';
      if (bpm < 150) return 'zone-aerobic';
      if (bpm < 170) return 'zone-threshold';
      return 'zone-max';
    }

    function getZoneText(bpm) {
      if (bpm < 120) return '暖身 / 輕度';
      if (bpm < 150) return '燃脂 / 有氧';
      if (bpm < 170) return '馬拉松 / 閾值';
      return '無氧 / 警示';
    }

    // 將數據寫入至 Sheet1
    async function saveToSheets() {
      if (connectedDevices.length === 0) {
        alert("目前沒有連接任何裝置！");
        return;
      }

      const payload = connectedDevices.map(d => {
        const sum = d.bpmHistory.reduce((a, b) => a + b, 0);
        return {
          id: d.id,
          itemNumber: d.itemNumber || "未對應", // 寫入 Sheet1 時記錄物品編號
          name: d.name,
          avgHr: d.bpmHistory.length ? Math.round(sum / d.bpmHistory.length) : 0,
          maxHr: d.maxHr,
          count: d.bpmHistory.length
        };
      });

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert("🎉 數據已傳送至 Google 試算表！");
      } catch (err) {
        alert("❌ 上傳失敗: " + err);
      }
    }
  </script>
</body>
</html>
